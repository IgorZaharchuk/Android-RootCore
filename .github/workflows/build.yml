name: Build Android RootCore

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test Release artifacts
        run: |
          chmod +x gradlew
          ./gradlew \
            :root-core:testReleaseUnitTest \
            :root-core:assembleRelease \
            :root-core-r8-test:assembleRelease

      - name: Prepare R8 diagnostic artifacts
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/rootcore-r8-diagnostics"
          mkdir -p "$OUT"

          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil

          out = Path(__import__("os").environ["RUNNER_TEMP"]) / "rootcore-r8-diagnostics"
          files = {
              "root-core-r8-test/build/outputs/mapping/release/mapping.txt":
                  "mapping.txt",
              "root-core/build/outputs/aar/root-core-release.aar":
                  "root-core-release.aar",
          }

          for source, target in files.items():
              src = Path(source)
              print(f"\nSOURCE: {src}")
              print(f"exists={src.exists()} is_file={src.is_file()} symlink={src.is_symlink()}")
              try:
                  resolved = src.resolve(strict=True)
                  print(f"resolved={resolved}")
                  print(f"size={resolved.stat().st_size}")
                  if resolved.is_file() and resolved.stat().st_size:
                      shutil.copy2(resolved, out / target)
                      print(f"COPIED: {target}")
              except Exception as e:
                  print(f"SKIPPED: {type(e).__name__}: {e}")

          # APK location can vary between Android Gradle Plugin versions.
          build_dir = Path("root-core-r8-test/build")
          print("\nAPK and output metadata discovered:")
          candidates = []
          if build_dir.exists():
              for item in build_dir.rglob("*"):
                  if item.is_file() and (
                      item.suffix.lower() == ".apk"
                      or item.name == "output-metadata.json"
                  ):
                      print(f"{item} ({item.stat().st_size} bytes)")
                      if item.suffix.lower() == ".apk" and item.stat().st_size:
                          candidates.append(item)

          for index, apk in enumerate(sorted(candidates), start=1):
              target = out / f"r8-smoke-{index}-{apk.name}"
              shutil.copy2(apk, target)
              print(f"COPIED APK: {apk} -> {target.name}")

          if not candidates:
              print("WARNING: no APK found under root-core-r8-test/build")

          print("\nPrepared diagnostic directory:")
          for f in out.iterdir():
              print(f"{f.name}: {f.stat().st_size} bytes")
          PYTHON

      - name: Verify minified RootCore bootstrap entry point
        shell: bash
        run: |
          set -euo pipefail

          MAPPING="root-core-r8-test/build/outputs/mapping/release/mapping.txt"
          AAR="root-core/build/outputs/aar/root-core-release.aar"

          mapfile -t APK_CANDIDATES < <(
            find root-core-r8-test/build \( -type f -o -type l \) -name '*.apk' -print 2>/dev/null | sort
          )

          APK=""
          for candidate in "${APK_CANDIDATES[@]}"; do
            if [ -s "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done

          if [ -z "$APK" ]; then
            echo "ERROR: no non-empty APK found under root-core-r8-test/build"
            echo "Build output files:"
            find root-core-r8-test/build -maxdepth 8 -type f -printf '%p (%s bytes)\n' 2>/dev/null | sort | tail -100 || true
            exit 1
          fi

          echo "Using APK: $APK"
          test -s "$APK"

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          unzip -q "$APK" 'classes*.dex' -d "$TMP"

          find "$TMP" -name 'classes*.dex' -type f -print0 \
            | xargs -0 -r strings > "$TMP/dex-strings.txt"

          echo "DEX files:"
          find "$TMP" -name 'classes*.dex' -type f -print

          FAILED=0

          check_match() {
            LABEL="$1"
            PATTERN="$2"
            MODE="$3"

            if [ "$MODE" = "exact" ]; then
              MATCH="grep -Fxq"
            else
              MATCH="grep -Fq"
            fi

            if [ "$MODE" = "exact" ]; then
              if grep -Fxq "$PATTERN" "$TMP/dex-strings.txt"; then
                echo "PASS: $LABEL"
              else
                echo "FAIL: $LABEL"
                FAILED=1
              fi
            else
              if grep -Fq "$PATTERN" "$TMP/dex-strings.txt"; then
                echo "PASS: $LABEL"
              else
                echo "FAIL: $LABEL"
                FAILED=1
              fi
            fi
          }

          check_match "RootCoreServer class descriptor"             'Lcom/rootcore/internal/RootCoreServer;' contains
          check_match "Constructor name" '<init>' exact
          check_match "start method name" 'start' exact

          if [ -f "$MAPPING" ]; then
            echo "R8 mapping entries for RootCoreServer:"
            grep -F 'com.rootcore.internal.RootCoreServer' "$MAPPING" || true
          else
            echo "WARNING: R8 mapping file not found: $MAPPING"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "R8 verification failed. Related DEX strings:"
            grep -E 'RootCoreServer|rootcore/internal|<init>|start'               "$TMP/dex-strings.txt" | head -80 || true
            exit 1
          fi

          echo "R8 verification passed."

      - name: Upload R8 diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rootcore-r8-diagnostics
          path: ${{ runner.temp }}/rootcore-r8-diagnostics/
          if-no-files-found: warn

      - name: Upload AAR
        uses: actions/upload-artifact@v7
        with:
          name: android-rootcore-aar
          path: root-core/build/outputs/aar/root-core-release.aar
          if-no-files-found: error
