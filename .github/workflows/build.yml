name: Build Android RootCore

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test Release artifacts
        run: |
          chmod +x gradlew
          ./gradlew \
            :root-core:testReleaseUnitTest \
            :root-core:assembleRelease \
            :root-core-r8-test:assembleRelease

      - name: Verify minified RootCore bootstrap entry point
        shell: bash
        run: |
          set -euo pipefail

          APK="root-core-r8-test/build/outputs/apk/release/root-core-r8-test-release.apk"
          MAPPING="root-core-r8-test/build/outputs/mapping/release/mapping.txt"
          AAR="root-core/build/outputs/aar/root-core-release.aar"
          test -s "$APK"

          DIAG_DIR="$RUNNER_TEMP/rootcore-r8-diagnostics"
          mkdir -p "$DIAG_DIR"

          echo "APK file information:"
          ls -l "$APK"
          echo "Resolved APK path:"
          readlink -f "$APK" || true
          file "$APK" || true

          # Copy the actual file, dereferencing a possible symlink.
          cp -L "$APK" "$DIAG_DIR/root-core-r8-test-release.apk"
          test -s "$DIAG_DIR/root-core-r8-test-release.apk"

          if [ -s "$MAPPING" ]; then
            cp -L "$MAPPING" "$DIAG_DIR/mapping.txt"
          fi

          if [ -s "$AAR" ]; then
            cp -L "$AAR" "$DIAG_DIR/root-core-release.aar"
          fi

          echo "Diagnostic files prepared:"
          ls -lh "$DIAG_DIR"

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          unzip -q "$APK" 'classes*.dex' -d "$TMP"

          find "$TMP" -name 'classes*.dex' -type f -print0 \
            | xargs -0 -r strings > "$TMP/dex-strings.txt"

          echo "DEX files:"
          find "$TMP" -name 'classes*.dex' -type f -print

          FAILED=0

          check_match() {
            LABEL="$1"
            PATTERN="$2"
            MODE="$3"

            if [ "$MODE" = "exact" ]; then
              MATCH="grep -Fxq"
            else
              MATCH="grep -Fq"
            fi

            if [ "$MODE" = "exact" ]; then
              if grep -Fxq "$PATTERN" "$TMP/dex-strings.txt"; then
                echo "PASS: $LABEL"
              else
                echo "FAIL: $LABEL"
                FAILED=1
              fi
            else
              if grep -Fq "$PATTERN" "$TMP/dex-strings.txt"; then
                echo "PASS: $LABEL"
              else
                echo "FAIL: $LABEL"
                FAILED=1
              fi
            fi
          }

          check_match "RootCoreServer class descriptor"             'Lcom/rootcore/internal/RootCoreServer;' contains
          check_match "Constructor name" '<init>' exact
          check_match "start method name" 'start' exact

          if [ -f "$MAPPING" ]; then
            echo "R8 mapping entries for RootCoreServer:"
            grep -F 'com.rootcore.internal.RootCoreServer' "$MAPPING" || true
          else
            echo "WARNING: R8 mapping file not found: $MAPPING"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "R8 verification failed. Related DEX strings:"
            grep -E 'RootCoreServer|rootcore/internal|<init>|start'               "$TMP/dex-strings.txt" | head -80 || true
            exit 1
          fi

          echo "R8 verification passed."

      - name: Upload R8 diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rootcore-r8-diagnostics
          path: ${{ runner.temp }}/rootcore-r8-diagnostics/
          if-no-files-found: error

      - name: Upload AAR
        uses: actions/upload-artifact@v7
        with:
          name: android-rootcore-aar
          path: root-core/build/outputs/aar/root-core-release.aar
          if-no-files-found: error
